name: Sync FanCode Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest public data
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.json \
            -o fancode.json
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.m3u \
            -o fancode.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fancode.json fancode.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync latest FanCode data"
          git push
